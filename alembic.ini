# Alembic configuration for ResearchMate
# Database credentials are dynamically injected from environment configuration (DEC-014).

[alembic]
script_location = database/migrations
prepend_sys_path = .
version_path_separator = os

# Placeholder URL - dynamically overridden in env.py from DATABASE_URL
sqlalchemy.url = 

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
